[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-automation"
version = "0.1.0"
description = "Script-first photo workflow for iNaturalist and stock metadata"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10",
    "tzdata; sys_platform == 'win32'",   # settings.LOCAL_TZ: Windows has no system zoneinfo database
    "lce @ git+https://github.com/rjmendez/lce@e2fa8ff0ebb69ee21db898306798efb0a587a998",   # shared cuda_dlls + upscale scale picker (daclip.py, sr_model.py, crop_upscale.py, tools/topaz_lab/lab.py)
]

[project.optional-dependencies]
social = ["bsky-oauth @ git+https://github.com/rjmendez/bsky-oauth@v0.2.0"]   # Bluesky posting (social-post/-login); `bsky-oauth install` after

[project.scripts]
bio = "bio_automation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

