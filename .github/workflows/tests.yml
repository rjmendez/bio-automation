# UNVERIFIED: written without being able to run GitHub Actions. First run on a pull request will show what still needs adjusting.
#
# Runs the test-honesty check and the pytest suite on pull requests and on pushes to main.
#
# Runner: windows-latest, because the code and its tests are written for Windows (D:\ paths, tzdata, exiftool.exe, the PowerShell deploy script).
# Python 3.12 is the oldest the project allows (pyproject requires-python >= 3.12); the machine itself runs 3.14.
#
# Needs one repository secret: BSKY_OAUTH_READ_TOKEN, a fine-grained token with read access to the private repo rjmendez/bsky-oauth
# (the tests import bsky_oauth and one runs its node helper up to the missing-session error, hence `bsky-oauth install`).
#
# What the run leaves out, by file and never by editing a test (AGENTS.md rule 10: no skip conditions added to real tests), and why:
#   tests/test_*_live.py      drive the real Topaz/DA-CLIP models, raw decoding and the focus-stack binary installed on the owner's machine.
#   tests/test_topaz_models.py skips itself loudly when the licensed Topaz model files are absent (they always are on a hosted runner); it is
#                              left IN the run so the skips show up as skips, not hidden.
#   pipeline/                  its own stage tests need piexif and the owner's NAS layout; they are not part of the package suite.
# Everything else (the social flow, rules, themes, hooks, selfcheck, ledger, queue, ...) runs.
name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check out bsky-oauth (private)
        uses: actions/checkout@v4
        with:
          repository: rjmendez/bsky-oauth
          ref: v0.2.0
          token: ${{ secrets.BSKY_OAUTH_READ_TOKEN }}
          path: _bsky-oauth

      - name: Install ExifTool (test_social runs the real exiftool)
        shell: pwsh
        run: choco install exiftool --no-progress -y

      - name: Install the package and the test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ./_bsky-oauth pytest numpy rawpy tifffile onnxruntime
          bsky-oauth install      # npm ci for its node helper: test_social runs the real library up to the point where it finds no session

      - name: Test honesty (AGENTS.md test-writing rules)
        run: python scripts/check_test_honesty.py --fail-stale

      - name: Unit tests
        run: >
          python -m pytest tests -q -p no:cacheprovider
          --ignore-glob="tests/test_*_live.py"
