# UNVERIFIED on GitHub: the YAML is parsed and checked by tests/test_ci_workflow.py, but only a real run shows the runner behaviour (choco, setup-python cache, the secrets-boolean expression).
#
# Runs the test-honesty check and the pytest suite on pull requests and on pushes to main.
#
# Runner: windows-latest, because the code and its tests are written for Windows (D:\ paths, tzdata, exiftool.exe, the PowerShell deploy script).
# Python 3.12 is the oldest the project allows (pyproject requires-python >= 3.12); the machine itself runs 3.14.
#
# Two test jobs, so a missing secret degrades the run instead of failing it at checkout (and never reports green for tests that did not run):
#   tests          always runs, needs NO secret: honesty check + the whole suite except the tests that need the private bsky-oauth library
#                  (tests/test_social_cleanup.py and the classes TestBskyBoundary and TestLocalFailuresBeforeTheWrite in tests/test_social.py).
#                  Its last step prints what it left out into the job summary and as a warning annotation.
#   tests-private  the full suite including those tests. It runs only when the repository secret BSKY_OAUTH_READ_TOKEN (a fine-grained
#                  token with read access to rjmendez/bsky-oauth) exists. Without it the job shows as SKIPPED, not green, and the `gate` job
#                  says so in the summary. Pull requests from forks have no secrets, so they get the public job only.
# tests/test_ci_workflow.py parses this file and fails when the pins, the credential handling or the deselect list drift.
#
# Secret handling (the steps below install packages and run the code of the pull request, so the token must not be reachable from them):
#   * The token is used by ONE step only, the checkout of bsky-oauth, as that step's `token:` input. It is not in `env:` of any step, so the
#     install, honesty and test steps (which run PR code: pip install -e . runs the PR's build backend, pytest imports the PR) never see it.
#   * persist-credentials: false on BOTH checkouts: the token is not written to .git/config of _bsky-oauth, so a later step cannot read it
#     from the checked-out tree (it was readable there before this change).
#   * `permissions: contents read` is the whole GITHUB_TOKEN; no job asks for more. Pull requests from forks get no secrets, so the
#     bsky-oauth checkout fails for them by design (nothing leaks; they need a maintainer to re-run the suite from a branch of this repo).
#   * Actions are pinned by commit SHA (the comment names the tag), bsky-oauth by the commit of v0.2.0, so a moved tag cannot change what runs.
#   * What remains: a same-repo pull request can still edit this workflow file and run it with the secret in its own run. That is how GitHub
#     treats same-repo branches; the mitigation is a token with read access to bsky-oauth only (as documented above) and a short expiry.
#
# What the run leaves out, by file and never by editing a test (AGENTS.md rule 10: no skip conditions added to real tests), and why:
#   tests/test_*_live.py      drive the real Topaz/DA-CLIP models, raw decoding and the focus-stack binary installed on the owner's machine.
#   tests/test_topaz_models.py skips itself loudly when the licensed Topaz model files are absent (they always are on a hosted runner); it is
#                              left IN the run so the skips show up as skips, not hidden.
#   pipeline/                  its own stage tests need piexif and the owner's NAS layout; they are not part of the package suite.
# Everything else (the social flow, rules, themes, hooks, selfcheck, ledger, queue, ...) runs.
name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # Tells the other jobs whether the private token exists. The step env holds only the boolean result of the comparison, never the token.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      have_token: ${{ steps.probe.outputs.have_token }}
    steps:
      - id: probe
        shell: bash
        env:
          HAVE_TOKEN: ${{ secrets.BSKY_OAUTH_READ_TOKEN != '' }}
        run: |
          echo "have_token=$HAVE_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAVE_TOKEN" = "true" ]; then
            echo "BSKY_OAUTH_READ_TOKEN is set: the full suite runs in the tests-private job." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=private tests NOT run::secret BSKY_OAUTH_READ_TOKEN is not available (not created yet, or a fork pull request). The tests-private job is skipped; only the public subset is tested."
            echo "### PARTIAL RUN: the private-library tests did NOT run" >> "$GITHUB_STEP_SUMMARY"
            echo "BSKY_OAUTH_READ_TOKEN is not available, so tests-private is skipped. Green on the tests job means the public subset passed, nothing more." >> "$GITHUB_STEP_SUMMARY"
          fi

  tests:
    needs: gate
    name: tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262    # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065    # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ExifTool (test_social runs the real exiftool)
        shell: pwsh
        run: choco install exiftool --no-progress -y

      - name: Install the package and the test dependencies (no bsky-oauth)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest numpy rawpy tifffile onnxruntime pyyaml

      - name: Test honesty (AGENTS.md test-writing rules)
        run: python scripts/check_test_honesty.py --fail-stale

      - name: Unit tests (everything that does not need bsky-oauth)
        run: >
          python -m pytest tests -q -p no:cacheprovider
          --ignore-glob="tests/test_*_live.py"
          --ignore=tests/test_social_cleanup.py
          --deselect=tests/test_social.py::TestBskyBoundary
          --deselect=tests/test_social.py::TestLocalFailuresBeforeTheWrite

      - name: What this run left out
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "### Left out of the tests job (they need the private bsky-oauth library)"
            echo "- tests/test_social_cleanup.py"
            echo "- tests/test_social.py: TestBskyBoundary, TestLocalFailuresBeforeTheWrite"
            echo "They run in tests-private when BSKY_OAUTH_READ_TOKEN exists (this run: have_token=${{ needs.gate.outputs.have_token }})."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.gate.outputs.have_token }}" != "true" ]; then
            echo "::warning title=partial run::the bsky-oauth tests were not run (no BSKY_OAUTH_READ_TOKEN)"
          fi

  tests-private:
    needs: gate
    if: ${{ needs.gate.outputs.have_token == 'true' }}
    name: tests-private (full suite, needs bsky-oauth)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262    # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065    # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check out bsky-oauth (private)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262    # v4
        with:
          repository: rjmendez/bsky-oauth
          ref: 3c574a8bcf4485a2f70c5882ae0027c2b9278c28                      # tag v0.2.0
          token: ${{ secrets.BSKY_OAUTH_READ_TOKEN }}
          persist-credentials: false
          path: _bsky-oauth

      - name: Install ExifTool (test_social runs the real exiftool)
        shell: pwsh
        run: choco install exiftool --no-progress -y

      - name: Install the package and the test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ./_bsky-oauth pytest numpy rawpy tifffile onnxruntime pyyaml
          bsky-oauth install      # npm ci for its node helper: test_social runs the real library up to the point where it finds no session

      - name: Test honesty (AGENTS.md test-writing rules)
        run: python scripts/check_test_honesty.py --fail-stale

      - name: Unit tests (the full suite)
        run: >
          python -m pytest tests -q -p no:cacheprovider
          --ignore-glob="tests/test_*_live.py"

  summary:
    # The one job that reads both results. A skipped tests-private (no token) is NOT a pass: it ends in an error annotation and a summary line that says
    # the private tests did not run, and a failed or cancelled test job fails this one. It stays green for a token-less run (a fork PR must be mergeable
    # by a maintainer), so the branch protection should require `tests` AND `summary`, and the maintainer reads the annotation.
    needs: [gate, tests, tests-private]
    if: ${{ always() }}
    name: tests-summary
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - shell: bash
        env:
          PUBLIC: ${{ needs.tests.result }}
          PRIVATE: ${{ needs.tests-private.result }}
        run: |
          echo "tests=$PUBLIC tests-private=$PRIVATE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLIC" != "success" ]; then
            echo "::error title=tests did not pass::the public test job result is $PUBLIC"
            exit 1
          fi
          if [ "$PRIVATE" = "failure" ] || [ "$PRIVATE" = "cancelled" ]; then
            echo "::error title=tests-private did not pass::the private test job result is $PRIVATE"
            exit 1
          fi
          if [ "$PRIVATE" != "success" ]; then
            echo "::error title=PRIVATE TESTS DID NOT RUN::tests-private result is $PRIVATE (no BSKY_OAUTH_READ_TOKEN). Only the public subset was tested; run scripts/premerge.ps1 before merging."
            echo "### NOT FULLY TESTED: tests-private $PRIVATE. Run scripts/premerge.ps1 before merging." >> "$GITHUB_STEP_SUMMARY"
          fi
